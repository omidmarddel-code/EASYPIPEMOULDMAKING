      async function viewFile(path) {
        const parts = path.split("/"),
          name = parts[parts.length - 1];

          if (DIR) {
            let ok =
              (await DIR.queryPermission({ mode: "read" })) === "granted";
            if (!ok)
              ok =
                (await DIR.requestPermission({ mode: "read" })) === "granted";
            if (ok) {
              let h = DIR;
              for (let i = 0; i < parts.length - 1; i++)
                h = await h.getDirectoryHandle(parts[i]);
              const f = await (await h.getFileHandle(name)).getFile();
              url = URL.createObjectURL(f);
              setTimeout(() => URL.revokeObjectURL(url), 60000);
            }
          }
          if (!url)
            url = new URL(
              path.split("/").map(encodeURIComponent).join("/"),
              location.href,
            ).href;
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          a.style.display = "none";
          document.body.append(a);
          a.click();
          a.remove();
        } catch (e) {
          toast(
            e && e.name === "NotFoundError"
              ? "فایل پیدا نشد؛ ممکن است جابه‌جا یا پاک شده باشد"

          parts.length < 2 ||
          parts[0] !== "شناسنامه" ||
          parts.some((q) => !q || q === "." || q === "..")

          return "ارتباط حذف شد؛ این فایل داخل پوشهٔ «شناسنامه» نیست و پاک نشد";

            if (
              raw0.slice(0, ds.rows[0].length).join("|") !==
              ds.rows[0].join("|")
            ) {
              const L = (ds.legacies || []).find(
                (l) => raw0.slice(0, l.h.length).join("|") === l.h.join("|"),
              );
              if (L) mig = L.map;
              else {
                toast("این فایل مربوط به این تب نیست");
                return false;
              }
            }
          }
          F.sheets.forEach((sh) => {
            const ws = wb.Sheets[sh.name];
            if (!ws) return;
            const w = sh.rows[0].length;
            const rawA = XLSX.utils.sheet_to_json(ws, {
              header: 1,
              defval: "",
              raw: true,
            });
            const cellStyles = {};
            Object.keys(ws).forEach((addr) => {
              if (addr[0] === "!") return;
              const cell = ws[addr];
              if (cell && (cell.s !== undefined || cell.z !== undefined)) {
                cellStyles[addr] = {};
                if (cell.s !== undefined) cellStyles[addr].s = cell.s;
                if (cell.z !== undefined) cellStyles[addr].z = cell.z;
              }
            });
            if (ws["!ref"] && XLSX.SSF && XLSX.SSF.is_date) {
              const r0 = XLSX.utils.decode_range(ws["!ref"]).s;
              rawA.forEach((row, ri) =>
                row.forEach((v, ci) => {
                  if (typeof v === "number") {
                    const cl =
                      ws[
                        XLSX.utils.encode_cell({ r: ri + r0.r, c: ci + r0.c })
                      ];
                    if (cl && cl.z && cl.w && XLSX.SSF.is_date(cl.z))
                      row[ci] = cl.w;
                  }
                }),
              );
            }
            let a = rawA.map((r) => {
              const o = [];
              for (let c = 0; c < w; c++) {
                const oc = mig && sh === ds ? mig[c] : c;
                let v = oc < 0 ? "" : r[oc];
                o.push(
                  v == null
                    ? ""
                    : typeof v === "number" || typeof v === "string"
                      ? v
                      : String(v),
                );
              }
              return o;
            });
            if (sh.kind === "data") {
              if (mig && sh === ds && a.length) a[0] = sh.rows[0].slice();
              a = a.map((r, i) => {
                if (sh.calc != null && i > 0) r[sh.calc] = "";
                return r;
              });
              while (
                a.length > 1 &&
                a[a.length - 1].every((v, c) => v === "" || c === sh.calc)
              )
                a.pop();
            }
            if (
              sh.kind === "guide" &&
              ds.legacies &&
              String(a[0] && a[0][0]).trim() === "راهنما"
            )
              return;
            sh.xlsxMeta = {
              cols: ws["!cols"],
              rows: ws["!rows"],
              sheetFormat: ws["!sheetFormat"],
              margins: ws["!margins"],
              cellStyles: compactCellStyles(cellStyles),
            };
            if (ws["!merges"]) sh.merges = ws["!merges"];
            if (a.length) {
              sh.rows = a;
              k++;
            }
          });
          if (k) F.dataTs = Date.now();
          persist(0);
          render();
          toast(k ? "فایل بارگذاری شد" : "شیتی با نام مشابه پیدا نشد");
          return k > 0;
        } catch (err) {
          toast("خواندن فایل ناموفق بود");
          return false;
        }
      }
      $("#imp").onchange = async (e) => {
        const f = e.target.files[0];
        if (f) await doImport(f);
        e.target.value = "";
      };
      $("#openf").onclick = async () => {
        try {
          const [h] = await window.showOpenFilePicker({
            types: [
              {
                description: "Excel",
                accept: {
                  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":
                    [".xlsx"],
                },
              },
            ],
          });
          try {
            await h.requestPermission({ mode: "readwrite" });
          } catch (e) {}
          if (await doImport(await h.getFile())) {
            H[S.f] = h;
            fileSaveFailed = false;
            hSet(S.f, h).catch(() => {});
            refreshSaveStatus();
          }
        } catch (e) {
          if (!e || e.name !== "AbortError") $("#imp").click();
        }
      };
      $("#savef").onclick = async () => {
        const h = H[S.f];
        if (!h) {
          if (typeof window.showSaveFilePicker === "function") {
            try {
              const nh = await window.showSaveFilePicker({
                suggestedName: D.files[S.f].file,
                types: [
                  {
                    description: "Excel",
                    accept: {
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":
                        [".xlsx"],
                    },
                  },
                ],
              });
              const w = await nh.createWritable();
              await w.write(mkbuf());
              await w.close();
              H[S.f] = nh;
              fileSaveFailed = false;
              hSet(S.f, nh).catch(() => {});
              refreshSaveStatus();
              toast("فایل ذخیره شد");
            } catch (e) {
              if (e && e.name !== "AbortError") $("#exp").click();
            }
            return;
          }
          $("#exp").click();
          return;
        }
        try {
          const w = await h.createWritable();
          await w.write(mkbuf());
          await w.close();
          fileSaveFailed = false;
          refreshSaveStatus();
          toast("فایل ذخیره شد");
        } catch (e) {
          $("#exp").click();
        }
      };
      $("#prt").onclick = async () => {
        const F = D.files[S.f],
          sh = F.sheets.find((s) => s.kind === "data"),
          q = S.q.trim().toLowerCase();
        const dl = window.claude ? await window.claude.use("downloads") : null;
        if (!dl) {
          S.s = F.sheets.indexOf(sh);
          render();
          $("#pt").textContent = F.title + " | شماره بندی";
          const oldTitle = document.title;
          const hidePrintCols = () => {
            $("#box")
              .querySelectorAll("table tr")
              .forEach((tr) =>
                (sh.fileCols || []).forEach((c) => {
                  const cell = tr.children[c + 1];
                  if (cell) cell.classList.remove("print-hide");
                }),
              );
            document.title = oldTitle;
          };
          $("#box")
            .querySelectorAll("table tr")
            .forEach((tr) =>
              (sh.fileCols || []).forEach((c) => {
                const cell = tr.children[c + 1];
                if (cell) cell.classList.add("print-hide");
              }),
            );
          document.title = "\u200B";
          addEventListener("afterprint", hidePrintCols, { once: true });
          try {
            window.print();
          } catch (e) {
            toast("پرینت ممکن نیست");
          }
          setTimeout(hidePrintCols, 2000);
          return;
        }
        const esc = (v) =>
          String(v)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        let rows = "";
        for (let i = 1; i < sh.rows.length; i++) {
          const r = sh.rows[i].slice();
          if (sh.calc != null) r[sh.calc] = calc(sh.rows[i], sh);
          if (!rowMatches(sh, sh.rows[i], i, q)) continue;
          rows +=
            "<tr><td>" +
            i +
            "</td>" +
            r
              .map((x, c) =>
                (sh.fileCols || []).includes(c)
                  ? ""
                  : "<td>" + esc(x) + "</td>",
              )
              .join("") +
            "</tr>";
        }
        const head =
          "<tr><th>#</th>" +
          sh.rows[0]
            .map((x, c) =>
              (sh.fileCols || []).includes(c) ? "" : "<th>" + esc(x) + "</th>",
            )
            .join("") +
          "</tr>";
        const css =
          "@page{size:A4 landscape;margin:12mm}body{font-family:Vazirmatn,Tahoma,sans-serif;font-size:9px;margin:0;color:#000}h1{text-align:center;font-size:16px;margin:0 0 2px}h2{text-align:center;font-size:11px;font-weight:400;margin:0 0 8px}table{border-collapse:collapse;table-layout:fixed;width:96%;margin:0 auto;direction:rtl}th,td{border:1px solid #888;padding:2px 3px;text-align:center;white-space:normal;overflow-wrap:anywhere}th{background:#eee}thead{display:table-header-group}tr{page-break-inside:avoid}td:first-child,th:first-child{width:42px;min-width:42px;text-align:center;white-space:nowrap}";
        const doc =
          '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>\u200B</title><style>' +
          css +
          "</style></head><body><h1>قالب سازی ایزی پایپ</h1><h2>" +
          esc(F.title) +
          " | شماره بندی</h2><table><thead>" +
          head +
          "</thead><tbody>" +
          rows +
          "</tbody></table><script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>";
        try {
          await dl.save({
            filename: "print-" + F.title.replace(/\s+/g, "-") + ".html",
            data: doc,
          });
          toast("فایل را باز کنید؛ پنجرهٔ پرینت خودکار باز می‌شود");
        } catch (e) {
          if (!e || e.code !== "declined") toast("آماده‌سازی پرینت انجام نشد");
        }
      };
      const idb = () =>
        new Promise((res, rej) => {
          const r = indexedDB.open("easypipe", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("h");
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      async function hSet(k, v) {
        const d = await idb();
        return new Promise((res, rej) => {
          const t = d.transaction("h", "readwrite");
          t.objectStore("h").put(v, k);
          t.oncomplete = res;
          t.onerror = () => rej(t.error);
        });
      }
      async function hAll() {
        const d = await idb();
        return new Promise((res, rej) => {
          const o = {},
            q = d.transaction("h").objectStore("h").openCursor();
          q.onsuccess = () => {
            const c = q.result;
            if (c) {
              o[c.key] = c.value;
              c.continue();
            } else res(o);
          };
          q.onerror = () => rej(q.error);
        });
      }
      async function attach(k, h) {
        try {
          const file = await h.getFile();
          const appTs = Number(D.files[+k].dataTs || D.ts || 0);
          const fileTs = Number(file.lastModified || 0);
          if (fileTs > appTs) {
            if (!(await doImport(file, +k))) return false;
          } else if (fileTs < appTs) {
            appNeedsSave = true;
            DIRTY.add(+k);
            autoSave(false);
          }
          H[k] = h;
          if (+k === S.f) fileSaveFailed = false;
          refreshSaveStatus();
          return true;
        } catch (e) {}
        return false;
      }
      async function restore() {
        if (typeof window.showOpenFilePicker !== "function") return;
        let all = {};
        try {
          all = await hAll();
        } catch (e) {}
        if (all.dir) DIR = all.dir;
        const pend = [];
        for (const k in all) {
          if (k === "app" || k === "dir") continue;
          const h = all[k];
          let p = "denied";
          try {
            p = await h.queryPermission({ mode: "readwrite" });
          } catch (e) {}
          if (p === "granted") await attach(k, h);
          else if (p === "prompt") pend.push([k, h]);
        }
        if (all.app) {
          let p = "denied";
          try {
            p = await all.app.queryPermission({ mode: "readwrite" });
          } catch (e) {}
          if (p === "granted") setApp(all.app);
          else if (p === "prompt") pend.push(["app", all.app]);
        }
        if (pend.length) {
          toast("برای وصل شدن به فایل‌ها یک بار روی صفحه کلیک کنید");
          addEventListener(
            "pointerdown",
            async () => {
              for (const [k, h] of pend) {
                try {
                  if (
                    (await h.requestPermission({ mode: "readwrite" })) ===
                    "granted"
                  ) {
                    if (k === "app") setApp(h);
                    else await attach(k, h);
                  }
                } catch (e) {}
              }
            },
            { once: true },
          );
        }
        if (!AH && !pend.some((x) => x[0] === "app")) {
          armApp();
        }
      }
      let armed = false;
      function armApp() {
        if (armed || window.top !== window) return;
        armed = true;
        const f = (e) => {
          if (AH) {
            removeEventListener("pointerdown", f);
            armed = false;
            return;
          }
          if (e.target.closest && e.target.closest("button,select,input"))
            return;
          removeEventListener("pointerdown", f);
          armed = false;
          askApp();
        };
        addEventListener("pointerdown", f);
      }
      async function askApp() {
        try {
          const [h] = await window.showOpenFilePicker({
            types: [
              {
                description: "HTML",
                accept: { "text/html": [".html", ".htm"] },
              },
            ],
          });
          try {
            await h.requestPermission({ mode: "readwrite" });
          } catch (e) {}
          const t = await (await h.getFile()).text();
          if (!/const\s+D\s*=\s*\{[\s\S]*?\};\s*const\s+ORIG\s*=/.test(t)) {
            toast("این فایل، فایل برنامه نیست؛ دوباره کلیک کنید");
            armApp();
            return;
          }
          setApp(h);
          hSet("app", h).catch(() => {});
          autoSave(true);
        } catch (e) {
          if (e && e.name !== "AbortError" && e.name !== "SecurityError")
            toast("ذخیره داخل برنامه در این نمایش ممکن نیست");
        }
      }
      $("#mb").onclick = () => document.body.classList.toggle("sbo");
      $("#ov").onclick = () => document.body.classList.remove("sbo");
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") document.body.classList.remove("sbo");
      });
      render();
      restore().then(scrollToLastRow);
    </script>
  </body>
</html>
